l_english:
 decision_group_type_eotr_realm_directives:0 "Edicts of the Realm"

 # Religion Policy decision
 eotr_set_religion_policy:0 "Set Religion Policy"
 eotr_set_religion_policy_desc:0 "Decide how your vassals should handle religion across the realm. Choose #V Convert#! to push your faith into counties of other faiths. This directive will only be given to vassals who share your faith and control counties with differing faiths. Choose #V None#! to ignore religion entirely."
 eotr_set_religion_policy_tooltip:0 "Choose how Edicts of the Realm handles religion when issuing realm-wide directives."
 eotr_set_religion_policy_confirm:0 "Set Religion Policy"

 eotr_religion_policy_convert_label:0 "Convert"
 eotr_religion_policy_convert_tooltip:0 "Vassals who share your faith and hold counties of other faiths will be assigned the #V Convert Faith#! [directive|E] when directives are issued."
 eotr_religion_policy_convert_effect_tooltip:0 "Religion Policy set to #V Convert#!."

 eotr_religion_policy_none_label:0 "None"
 eotr_religion_policy_none_tooltip:0 "Religion is ignored when directives are issued."
 eotr_religion_policy_none_effect_tooltip:0 "Religion Policy set to #V None#!."

 # Culture Policy decision
 eotr_set_culture_policy:0 "Set Culture Policy"
 eotr_set_culture_policy_desc:0 "Decide how your vassals should handle culture. Pick #V Convert#! to push your culture into counties of other cultures. This directive will only be given to vassals who share your culture and control counties of foreign cultures. Choose #V Acceptance#! to increase cultural acceptance. This directive will be given to all vassals who control counties of foriegn cultures, regardless of whether or not the vassals own culture matches your own. Choose #V None#! to ignore culture enitrely."
 eotr_set_culture_policy_tooltip:0 "Choose how Edicts of the Realm handles culture when issuing realm-wide directives."
 eotr_set_culture_policy_confirm:0 "Set Culture Policy"

 eotr_culture_policy_convert_label:0 "Convert"
 eotr_culture_policy_convert_tooltip:0 "Vassals who share your culture and hold counties of differing cultures will be assigned the #V Convert Culture#! [directive|E]."
 eotr_culture_policy_convert_effect_tooltip:0 "Culture Policy set to #V Convert#!."

 eotr_culture_policy_accept_label:0 "Acceptance"
 eotr_culture_policy_accept_tooltip:0 "Any vassal whose lands include at least one county of a different culture than the vassal will be assigned the #V Improve Cultural Acceptance#! [directive|E]."
 eotr_culture_policy_accept_effect_tooltip:0 "Culture Policy set to #V Acceptance#!."

 eotr_culture_policy_none_label:0 "None"
 eotr_culture_policy_none_tooltip:0 "Culture is ignored when directives are issued."
 eotr_culture_policy_none_effect_tooltip:0 "Culture Policy set to #V None#!."
 # Priority decision
 eotr_set_priority:0 "Set Conflict Priority"
 eotr_set_priority_desc:0 "When both your Religion and Culture policies produce a directive for the same vassal, this setting decides which wins. Has no effect when only one (or neither) directive would be applied."
 eotr_set_priority_tooltip:0 "Decide whether religion or culture wins when both apply to the same vassal."
 eotr_set_priority_confirm:0 "Set Priority"

 eotr_priority_religion_label:0 "Religion First"
 eotr_priority_religion_opt_tooltip:0 "When both apply, the religion directive wins."
 eotr_priority_religion_effect_tooltip:0 "Priority set to #V Religion First#!."

 eotr_priority_culture_label:0 "Culture First"
 eotr_priority_culture_opt_tooltip:0 "When both apply, the culture directive wins."
 eotr_priority_culture_effect_tooltip:0 "Priority set to #V Culture First#!."

 # Default Edict decision
 eotr_set_default_edict:0 "Set Default Edict"
 eotr_set_default_edict_desc:0 "When neither a religion directive nor a culture directive can be applied to a vassal, this directive is applied instead. Pick #V Foster Prosperity#! to focus on building economic buildings, #V Reinforce the Borders#! to focus on building fortifications, #V Marshal the Hosts#! to focus on building military buildings, or #V None#! to leave such vassals with no directive."
 eotr_set_default_edict_tooltip:0 "Choose the fallback directive for vassals where no religion or culture rule applies."
 eotr_set_default_edict_confirm:0 "Set Default Edict"

 eotr_default_prosperity_label:0 "Foster Prosperity"
 eotr_default_prosperity_opt_tooltip:0 "Sets the Default Edict to the #V Construct Economic Buildings#! [directive|E]."
 eotr_default_prosperity_effect_tooltip:0 "Default Edict set to #V Construct Economic Buildings#!."

 eotr_default_bulwark_label:0 "Reinforce the Borders"
 eotr_default_bulwark_opt_tooltip:0 "Sets the Default Edict to the #V Construct Fortification Buildings#! [directive|E]."
 eotr_default_bulwark_effect_tooltip:0 "Default Edict set to #V Construct Fortification Buildings#!."

 eotr_default_martial_label:0 "Marshal the Hosts"
 eotr_default_martial_opt_tooltip:0 "Sets the Default Edict to the #V Construct Military Buildings#! [directive|E]."
 eotr_default_martial_effect_tooltip:0 "Default Edict set to #V Construct Military Buildings#!."

 eotr_default_none_label:0 "None"
 eotr_default_none_opt_tooltip:0 "Sets the Default Edict to #V Remove Existing#! [directive|E]."
 eotr_default_none_effect_tooltip:0 "Default Edict set to #V Remove Existing#! [directive|E]."

 # Apply decision
 eotr_apply_directives:0 "Issue Directives to the Realm"
 eotr_apply_directives_desc:0 "Push your current Edicts of the Realm settings across every sub-realm vassal. Each vassal receives a directive matched to their faith, culture, and lands; vassals with nothing to do under your Religion or Culture policies receive your Default Edict (if any)."
 eotr_apply_directives_tooltip:0 "Apply your settings to every landed AI vassal in your sub-realm."
 eotr_apply_directives_confirm:0 "Issue Directives"
 eotr_apply_directives_effect_tooltip:0 "Every landed AI vassal at or below county tier receives a directive based on your current Edicts of the Realm settings."
